<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Генератор конспектов</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
            padding: 30px 25px;
            text-align: center;
        }

        .header h1 {
            font-size: 2em;
            margin-bottom: 5px;
        }

        .form-container {
            padding: 40px 30px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }

        .required {
            color: #e74c3c;
        }

        input {
            width: 100%;
            padding: 15px;
            border: 2px solid #e1e8ed;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #4facfe;
        }

        .hint {
            font-size: 0.9em;
            color: #666;
            margin-top: 5px;
        }

        .submit-btn {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
        }

        .links a {
            flex: 1;
            padding: 12px;
            text-align: center;
            color: #4facfe;
            text-decoration: none;
            border: 2px solid #4facfe;
            border-radius: 8px;
            font-weight: 500;
            transition: all 0.3s;
        }

        .links a:hover {
            background: #4facfe;
            color: white;
        }

        @media (max-width: 600px) {
            body {
                padding: 10px;
            }

            .container {
                margin: 0;
                border-radius: 12px;
            }

        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Генератор конспектов</h1>
            <p>Создайте задание для PDF-конспектора из видеолекции</p>
        </div>

        <div class="form-container">

            <form method="POST" action="/submit">
                <div class="form-group">
                    <label for="lecture_name">
                        Название лекции <span class="required">*</span>
                    </label>
                    <input
                        type="text"
                        id="lecture_name"
                        name="lecture_name"
                        required
                        maxlength="200"
                        placeholder="ВвОТ: Лекция №1 - Введение в облачные технологии"
                    >
                    <div class="hint">Макс. 200 символов. Отображается в PDF</div>
                </div>

                <div class="form-group">
                    <label for="video_url">
                        Ссылка на видео Яндекс.Диска <span class="required">*</span>
                    </label>
                    <input
                        type="url"
                        id="video_url"
                        name="video_url"
                        required
                        placeholder="https://disk.yandex.ru/i/ABC123def456GHI789"
                    >
                    <div class="hint">Только публичные ссылки на яндекс диск</div>
                </div>

                <button type="submit" class="submit-btn">
                    Создать конспект
                </button>
            </form>
        </div>
    </div>

    <script>
        document.getElementById('lecture_name').focus();

        document.getElementById('video_url').addEventListener('input', function(e) {
            const value = e.target.value;
            const pattern = /https:\/\/disk\.yandex\.(ru|com)\/i\/[a-zA-Z0-9_-]+/;
            e.target.style.borderColor = value && !pattern.test(value) ? '#e74c3c' : '#e1e8ed';
        });
    </script>
</body>
</html>
